<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Connexion · Imprimantes</title>
  <meta name="theme-color" content="#1a1d23">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="connexion">

  <!-- étape 1 : e-mail + mot de passe -->
  <form id="etape-mdp" class="card" autocomplete="on">
    <div>
      <h1>Imprimantes</h1>
      <p class="muted small">Connecte-toi pour piloter tes machines.</p>
    </div>
    <label class="champ">E-mail
      <input id="email" type="email" autocomplete="username" required maxlength="254" autofocus>
    </label>
    <label class="champ">Mot de passe
      <input id="motdepasse" type="password" autocomplete="current-password" required maxlength="256">
    </label>
    <p id="erreur-mdp" class="message erreur" hidden></p>
    <button id="btn-mdp" class="primaire">Continuer</button>
  </form>

  <!-- étape 2 : code de l'application d'authentification -->
  <form id="etape-code" class="card" hidden>
    <div>
      <h1>Code de vérification</h1>
      <p class="muted small">Ouvre ton application d'authentification et saisis le code à 6 chiffres.</p>
    </div>
    <label class="champ">Code
      <input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
    </label>
    <label class="champ" id="champ-secours" hidden>Code de secours
      <input id="secours" autocomplete="off" maxlength="20" placeholder="abcd-efgh-ijkl">
    </label>
    <p id="erreur-code" class="message erreur" hidden></p>
    <button id="btn-code" class="primaire">Se connecter</button>
    <button id="lien-secours" type="button" class="lien">Je n'ai pas mon téléphone : utiliser un code de secours</button>
    <button id="lien-retour" type="button" class="lien">← Revenir au mot de passe</button>
  </form>

</main>
<div id="toasts" class="toasts"></div>
<script src="config.js"></script>
<script src="commun.js"></script>
<script src="connexion.js"></script>
</body>
</html>
